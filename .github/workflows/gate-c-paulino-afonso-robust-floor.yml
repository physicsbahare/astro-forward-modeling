name: gate-c-paulino-afonso-robust-floor

on:
  push:
    branches:
      - verification-v0.1
    paths:
      - "scripts/run_paulino_afonso_multistart_allcase_noiseless.py"
      - "verification/paulino_afonso_sersic_floor.py"
      - ".github/workflows/gate-c-paulino-afonso-robust-floor.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_paulino_afonso_multistart_allcase_noiseless.py"
      - "verification/paulino_afonso_sersic_floor.py"
      - ".github/workflows/gate-c-paulino-afonso-robust-floor.yml"
  workflow_dispatch:

jobs:
  allcase-noiseless-robust-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification harness
        run: python -m pip install -e ".[test]"

      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-robust-floor-pip-freeze.txt

      - name: Run all-case noiseless robust multistart floor
        run: python scripts/run_paulino_afonso_multistart_allcase_noiseless.py

      - name: Upload robust-floor metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-robust-floor
          path: |
            gate-c-paulino-afonso-robust-floor-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/multistart_allcase_noiseless/
          if-no-files-found: warn
