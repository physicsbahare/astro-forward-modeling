name: gate-b-core-crosscode

on:
  push:
    branches:
      - verification-v0.1
    paths:
      - 'crosscode/**'
      - 'verification/**'
      - 'requirements-crosscode-*.txt'
      - 'pyproject.toml'
      - '.github/workflows/gate-b-core.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

jobs:
  crosscode-core:
    # Routing only; skipped jobs are NOT new scientific results. See docs/VERIFICATION_CI_ROUTING.md.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.number == 5 && github.event.pull_request.draft) && !(github.event_name == 'push' && github.ref == 'refs/heads/verification-v0.1' && github.event.before == '88f3fb646a0b89e6cb9b8b8ee1aacae377edca56' && contains(github.event.head_commit.message, '[C5e isolated]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install independent harness as an editable package
        run: python -m pip install -e ".[test]"
      - name: Install pinned Gate-B astronomy packages
        run: python -m pip install -r requirements-crosscode-core.txt
      - name: Show resolved package versions
        run: python -m pip freeze
      - name: Run Gate-B core cross-code checks
        run: pytest -q crosscode/test_gate_b_core.py
