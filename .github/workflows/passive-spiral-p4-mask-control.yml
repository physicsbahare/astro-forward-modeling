name: passive-spiral-p4-mask-control

on:
  push:
    branches:
      - verification-v0.1
    paths:
      - "benchmarks/passive_spiral_redshift/P4_PROTOCOL.md"
      - "verification/passive_spiral_mask_control.py"
      - "tests/test_passive_spiral_mask_control.py"
      - "scripts/run_passive_spiral_mask_control_p4.py"
      - ".github/workflows/passive-spiral-p4-mask-control.yml"
      - "pyproject.toml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "benchmarks/passive_spiral_redshift/P4_PROTOCOL.md"
      - "verification/passive_spiral_mask_control.py"
      - "tests/test_passive_spiral_mask_control.py"
      - "scripts/run_passive_spiral_mask_control_p4.py"
      - ".github/workflows/passive-spiral-p4-mask-control.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  p4-mask-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification harness
        run: python -m pip install -e ".[test]"

      - name: Record software provenance
        run: python -m pip freeze | tee passive-spiral-p4-pip-freeze.txt

      - name: Run P4 regression tests
        run: pytest -q tests/test_passive_spiral_mask_control.py

      - name: Download exact frozen Gate-D real cutout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p real_artifact
          gh run download 33941326833 -n gate-d-cosmosweb-real-cutout -D real_artifact
          echo '764d542f2417810c904bce711455b3eb69c70cf388f97348cb857b056b2dd66d  real_artifact/cosmosweb_f444w_30mas_A1_ID4204_real_cutout.fits' | sha256sum --check --strict

      - name: Run frozen P4 mask-control experiment
        run: |
          python scripts/run_passive_spiral_mask_control_p4.py \
            --real-fits real_artifact/cosmosweb_f444w_30mas_A1_ID4204_real_cutout.fits \
            --matrix benchmarks/gate_d/COSMOSWEB_D1_INJECTION_MATRIX.json \
            --out benchmark_output/passive_spiral_redshift/p4_mask_control \
            | tee passive-spiral-p4-stdout.txt

      - name: Upload P4 metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passive-spiral-p4-mask-control
          path: |
            passive-spiral-p4-pip-freeze.txt
            passive-spiral-p4-stdout.txt
            benchmark_output/passive_spiral_redshift/p4_mask_control/
          if-no-files-found: warn
