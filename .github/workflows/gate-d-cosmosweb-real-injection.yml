name: gate-d-cosmosweb-real-injection
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - benchmarks/gate_d/COSMOSWEB_D1_CONTEXT_AUDIT_RESULT.md
      - benchmarks/gate_d/COSMOSWEB_D1_INJECTION_MATRIX.json
      - benchmarks/gate_d/COSMOSWEB_D1_REAL_INJECTION_PROTOCOL.md
      - scripts/run_gate_d_cosmosweb_real_injection.py
      - tests/test_gate_d_cosmosweb_real_injection.py
      - .github/workflows/gate-d-cosmosweb-real-injection.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gate-d-cosmosweb-real-injection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-l1-injection:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      STPSF_DATA_VERSION: "2.2.0"
      STPSF_DATA_URL: "https://stsci.box.com/shared/static/mjst9j056ibf2uph4gxy8qxmi89tjzwk.gz"
      STPSF_DATA_SHA256: "bbdfbe7c5aa7ee7fdb60efed13720ba3e0619c976b77aa0d63941dd59a4b6a98"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]' astropy scipy
      - run: python -m pip install -r requirements-crosscode-jwst-stpsf.txt
      - run: python -m pytest -q tests/test_gate_d_cosmosweb_real_injection.py
      - name: Download exact pinned STPSF reference data
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stpsf-data-${STPSF_DATA_VERSION}.tar.gz"
          root="$RUNNER_TEMP/stpsf-reference"; mkdir -p "$root"
          curl --fail --location --retry 5 --retry-delay 2 "$STPSF_DATA_URL" -o "$archive"
          printf '%s  %s\n' "$STPSF_DATA_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$root"
          data_dir="$(dirname "$(find "$root" -type f -name version.txt -print -quit)")"
          test "$(cat "$data_dir/version.txt")" = "$STPSF_DATA_VERSION"
          echo "STPSF_PATH=$data_dir" >> "$GITHUB_ENV"
      - name: Download frozen real COSMOS-Web cutout
        run: |
          mkdir -p real_artifact
          gh run download 33941326833 -n gate-d-cosmosweb-real-cutout -D real_artifact
          echo '764d542f2417810c904bce711455b3eb69c70cf388f97348cb857b056b2dd66d  real_artifact/cosmosweb_f444w_30mas_A1_ID4204_real_cutout.fits' | sha256sum -c -
      - name: Run frozen real-mosaic injection matrix
        run: |
          mkdir -p gate_d_injection
          python scripts/run_gate_d_cosmosweb_real_injection.py \
            --real-fits real_artifact/cosmosweb_f444w_30mas_A1_ID4204_real_cutout.fits \
            --matrix benchmarks/gate_d/COSMOSWEB_D1_INJECTION_MATRIX.json \
            --out-fits gate_d_injection/injected_scenes.fits \
            --out-json gate_d_injection/summary.json | tee gate_d_injection/stdout.txt
          python -m pip freeze > gate_d_injection/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-d-cosmosweb-real-injection
          path: gate_d_injection/
          if-no-files-found: warn
