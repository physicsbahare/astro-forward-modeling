name: gate-d-cosmosweb-local-ingest-interface
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - benchmarks/gate_d/COSMOSWEB_D0_RESULT.md
      - benchmarks/gate_d/COSMOSWEB_D1_LOCAL_INGEST_PROTOCOL.md
      - scripts/run_gate_d_cosmosweb_local_ingest.py
      - tests/test_gate_d_cosmosweb_local_ingest.py
      - .github/workflows/gate-d-cosmosweb-local-ingest-interface.yml
permissions:
  contents: read
concurrency:
  group: gate-d-cosmosweb-local-ingest-interface-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-interface-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' astropy
      - run: python -m pytest -q tests/test_gate_d_cosmosweb_local_ingest.py
