name: gate-c-paulino-afonso-full-chain-morphology

on:
  pull_request:
    paths:
      - 'scripts/run_paulino_afonso_full_chain_morphology_recovery.py'
      - 'scripts/run_paulino_afonso_full_chain_califa.py'
      - 'verification/paulino_afonso_sersic_floor.py'
      - '.github/workflows/gate-c-paulino-afonso-full-chain-morphology.yml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  full-chain-morphology-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install verification harness
        run: python -m pip install -e '.[test]'
      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-full-chain-morphology-pip-freeze.txt
      - name: Recover morphology from degraded CALIFA-like images
        run: python scripts/run_paulino_afonso_full_chain_morphology_recovery.py
      - name: Upload morphology-recovery metrics and provenance
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-full-chain-morphology
          path: |
            gate-c-paulino-afonso-full-chain-morphology-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/full_chain_morphology_recovery/
