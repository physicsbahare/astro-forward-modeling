name: gate-c-paulino-afonso-fitter-render-floor

on:
  pull_request:
    paths:
      - 'scripts/diagnose_paulino_afonso_fitter_render_floor.py'
      - 'scripts/run_paulino_afonso_full_chain_califa.py'
      - 'verification/paulino_afonso_sersic_floor.py'
      - '.github/workflows/gate-c-paulino-afonso-fitter-render-floor.yml'
  workflow_dispatch:

jobs:
  fitter-render-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification harness
        run: python -m pip install -e '.[test]'
      - name: Record software provenance
        run: python -m pip freeze > gate-c-paulino-afonso-fitter-render-floor-pip-freeze.txt
      - name: Run fitter render-floor diagnostic
        run: python scripts/diagnose_paulino_afonso_fitter_render_floor.py
      - name: Upload render-floor metrics
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-fitter-render-floor
          path: |
            gate-c-paulino-afonso-fitter-render-floor-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/fitter_render_floor/
