name: gate-c-agn-estimated-weights
on:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_estimated_weights.py
      - tests/test_agn_estimated_weights.py
      - .github/workflows/gate-c-agn-estimated-weights.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  estimated-weights:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_snr: [100, 20, 5]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_agn_estimated_weights.py tests/test_agn_shot_noise.py tests/test_agn_nuclear_fraction_noiseless.py tests/test_agn_nuclear_fraction.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-shot-noise-snr${{ matrix.host_snr }}
          run-id: 33680659156
          github-token: ${{ github.token }}
          path: source_noise
      - name: Record provenance
        run: |
          mkdir -p benchmark_output/agn_estimated_weights
          git rev-parse HEAD > benchmark_output/agn_estimated_weights/commit.txt
          python -m pip freeze > benchmark_output/agn_estimated_weights/pip-freeze.txt
      - run: python scripts/run_agn_estimated_weights.py --input source_noise
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-estimated-weights-snr${{ matrix.host_snr }}
          path: benchmark_output/agn_estimated_weights/
          if-no-files-found: error
