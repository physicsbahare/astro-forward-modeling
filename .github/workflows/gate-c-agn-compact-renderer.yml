name: gate-c-agn-compact-renderer
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_compact_renderer.py
      - tests/test_agn_compact_renderer.py
      - benchmarks/zhuang_shen_2024/C5I_PROTOCOL.md
      - .github/workflows/gate-c-agn-compact-renderer.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-compact-renderer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compact-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_n: [1, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - run: python -m pytest -q tests/test_agn_compact_renderer.py tests/test_agn_imfit_renderer.py tests/test_agn_empirical_psf_transfer.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-imfit-renderer-n${{ matrix.host_n }}
          run-id: 33759931812
          github-token: ${{ github.token }}
          path: parent-renderer
      - name: Frozen compact-renderer diagnosis
        run: python scripts/run_agn_compact_renderer.py --source parent-renderer --host-n ${{ matrix.host_n }} --out compact-renderer-output
      - if: always()
        run: |
          mkdir -p compact-renderer-output
          git rev-parse HEAD > compact-renderer-output/commit.txt
          python -m pip freeze > compact-renderer-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-compact-renderer-n${{ matrix.host_n }}
          path: compact-renderer-output
