name: gate-c-agn-empirical-agn-centroid
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_empirical_agn_centroid.py
      - tests/test_agn_empirical_agn_centroid.py
      - .github/workflows/gate-c-agn-empirical-agn-centroid.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-empirical-nuclear-centroid-${{ github.ref }}
  cancel-in-progress: false
jobs:
  nuclear-centroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_n: [1, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - run: python -m pytest -q tests/test_agn_empirical_agn_centroid.py tests/test_agn_empirical_psf_centroid.py tests/test_agn_empirical_psf_transfer.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-empirical-psf-transfer-n${{ matrix.host_n }}
          run-id: 33717899427
          github-token: ${{ github.token }}
          path: parent-transfer
      - run: python scripts/run_agn_empirical_agn_centroid.py --source parent-transfer --host-n ${{ matrix.host_n }} --out nuclear-centroid-output
      - if: always()
        run: |
          mkdir -p nuclear-centroid-output
          git rev-parse HEAD > nuclear-centroid-output/commit.txt
          python -m pip freeze > nuclear-centroid-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-empirical-agn-centroid-n${{ matrix.host_n }}
          path: nuclear-centroid-output
