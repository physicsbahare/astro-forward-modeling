name: gate-c-agn-cell-response
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_cell_response.py
      - tests/test_agn_cell_response.py
      - benchmarks/zhuang_shen_2024/C5L_PROTOCOL.md
      - .github/workflows/gate-c-agn-cell-response.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-cell-response-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cell-response:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_n: [1, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - run: python -m pytest -q tests/test_agn_cell_response.py tests/test_agn_fourier_grid.py tests/test_agn_fourier_controls.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-fourier-grid-n${{ matrix.host_n }}
          run-id: 33788705952
          github-token: ${{ github.token }}
          path: parent-grid
      - uses: actions/download-artifact@v4
        with:
          name: agn-compact-renderer-n${{ matrix.host_n }}
          run-id: 33766246396
          github-token: ${{ github.token }}
          path: parent-imfit
      - name: Frozen finite-cell convention diagnostic
        run: python scripts/run_agn_cell_response.py --source parent-grid --imfit-source parent-imfit --host-n ${{ matrix.host_n }} --out cell-response-output
      - if: always()
        run: |
          mkdir -p cell-response-output
          git rev-parse HEAD > cell-response-output/commit.txt
          python -m pip freeze > cell-response-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-cell-response-n${{ matrix.host_n }}
          path: cell-response-output
