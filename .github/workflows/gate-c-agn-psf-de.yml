name: gate-c-agn-psf-de
on:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_psf_de.py
      - tests/test_agn_psf_de.py
      - .github/workflows/gate-c-agn-psf-de.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  differential-evolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_n: [1,4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' 'numpy==2.5.2' 'scipy==1.18.1'
      - run: python -m pytest -q tests/test_agn_psf_de.py tests/test_agn_psf_plateau.py tests/test_agn_psf_width.py tests/test_agn_nuclear_fraction_noiseless.py tests/test_agn_nuclear_fraction.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-psf-plateau-n${{ matrix.host_n }}
          run-id: 33705072892
          github-token: ${{ github.token }}
          path: source_plateau
      - name: Record provenance
        run: |
          mkdir -p benchmark_output/agn_psf_de
          git rev-parse HEAD > benchmark_output/agn_psf_de/commit.txt
          python -m pip freeze > benchmark_output/agn_psf_de/pip-freeze.txt
      - run: python scripts/run_agn_psf_de.py --input source_plateau --host-n ${{ matrix.host_n }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-psf-de-n${{ matrix.host_n }}
          path: benchmark_output/agn_psf_de/
          if-no-files-found: error
