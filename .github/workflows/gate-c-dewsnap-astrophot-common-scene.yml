name: gate-c-dewsnap-astrophot-common-scene
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - requirements-dewsnap-astrophot.txt
      - scripts/run_dewsnap_astrophot_common_scene.py
      - scripts/audit_dewsnap_astrophot_common_scene.py
      - tests/test_dewsnap_astrophot_common_scene.py
      - benchmarks/dewsnap_2025/C6B_PROTOCOL.md
      - benchmarks/zhuang_shen_2024/c5o_33819349854.json
      - .github/workflows/gate-c-dewsnap-astrophot-common-scene.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: dewsnap-astrophot-common-scene-${{ github.ref }}
  cancel-in-progress: false
jobs:
  common-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dewsnap-astrophot.txt
      - name: Install pinned CPU runtime and AstroPhot
        run: |
          python -m pip install 'torch==2.14.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dewsnap-astrophot.txt -e '.[test]'
      - name: Require exact selected versions
        run: python -c "import importlib.metadata as m, torch; assert m.version('astrophot') == '0.18.0'; assert torch.__version__ == '2.14.0+cpu'"
      - name: Pinned API and convention tests
        run: python -m pytest -q tests/test_dewsnap_astrophot_common_scene.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-imfit-free-shape-n1
          run-id: 33819349854
          github-token: ${{ github.token }}
          path: parent-c5o-n1
      - name: Run frozen C6b common-scene diagnostic
        run: python scripts/run_dewsnap_astrophot_common_scene.py --source parent-c5o-n1 --out dewsnap-astrophot-common-scene-output
      - name: Read-only C6b artifact audit
        run: python scripts/audit_dewsnap_astrophot_common_scene.py --source dewsnap-astrophot-common-scene-output
      - if: always()
        run: |
          mkdir -p dewsnap-astrophot-common-scene-output
          git rev-parse HEAD > dewsnap-astrophot-common-scene-output/commit.txt
          python -m pip freeze > dewsnap-astrophot-common-scene-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dewsnap-astrophot-common-scene-c6b
          path: dewsnap-astrophot-common-scene-output
          if-no-files-found: error
