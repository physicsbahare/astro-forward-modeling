name: gate-c-paulino-afonso-full-chain-information

on:
  pull_request:
    paths:
      - 'scripts/audit_paulino_afonso_full_chain_information.py'
      - 'scripts/run_paulino_afonso_full_chain_califa.py'
      - 'verification/paulino_afonso_sersic_floor.py'
      - '.github/workflows/gate-c-paulino-afonso-full-chain-information.yml'
  workflow_dispatch:

jobs:
  information-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification harness
        run: python -m pip install -e '.[test]'
      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-full-chain-information-pip-freeze.txt
      - name: Audit extended-source morphology information
        run: python scripts/audit_paulino_afonso_full_chain_information.py
      - name: Upload information audit metrics and provenance
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-full-chain-information
          path: |
            gate-c-paulino-afonso-full-chain-information-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/full_chain_information_audit/
