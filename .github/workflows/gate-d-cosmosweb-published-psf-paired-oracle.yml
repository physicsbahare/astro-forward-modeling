name: gate-d-cosmosweb-published-psf-paired-oracle
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - benchmarks/gate_d/COSMOSWEB_D1_PUBLISHED_PSF_PAIRED_ORACLE_PROTOCOL.md
      - scripts/run_gate_d_cosmosweb_published_psf_paired_oracle.py
      - tests/test_gate_d_cosmosweb_published_psf_paired_oracle.py
      - .github/workflows/gate-d-cosmosweb-published-psf-paired-oracle.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gate-d-cosmosweb-published-psf-paired-oracle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-psf-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      STPSF_DATA_VERSION: "2.2.0"
      STPSF_DATA_URL: "https://stsci.box.com/shared/static/mjst9j056ibf2uph4gxy8qxmi89tjzwk.gz"
      STPSF_DATA_SHA256: "bbdfbe7c5aa7ee7fdb60efed13720ba3e0619c976b77aa0d63941dd59a4b6a98"
      PSF_ROOT: "https://ariel.astro.illinois.edu/cosmos_web/nircam/psf"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]' astropy scipy
      - run: python -m pip install -r requirements-crosscode-jwst-stpsf.txt
      - run: python -m pytest -q tests/test_gate_d_cosmosweb_published_psf_paired_oracle.py
      - name: Download exact pinned STPSF reference data
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stpsf-data-${STPSF_DATA_VERSION}.tar.gz"
          root="$RUNNER_TEMP/stpsf-reference"; mkdir -p "$root"
          curl --fail --location --retry 5 --retry-delay 2 "$STPSF_DATA_URL" -o "$archive"
          printf '%s  %s\n' "$STPSF_DATA_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$root"
          data_dir="$(dirname "$(find "$root" -type f -name version.txt -print -quit)")"
          test "$(cat "$data_dir/version.txt")" = "$STPSF_DATA_VERSION"
          echo "STPSF_PATH=$data_dir" >> "$GITHUB_ENV"
      - name: Download frozen successful D1d injection artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p injection_artifact
          gh run download 33949290838 -n gate-d-cosmosweb-real-injection -D injection_artifact
          test -s injection_artifact/injected_scenes.fits
          test -s injection_artifact/summary.json
      - name: Download checksum-pinned published COSMOS-Web PSFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published_psf
          declare -A expected
          expected[broad]="d47aef599653471f8efd89a31b8ca9f6753eee999865ae6914ddada97ed4e287"
          expected[global]="73228d109bcb1e67f3058adb2ff57cfa5223de5bb4b1e32e142cbb403d0f7eac"
          expected[narrow]="298f5794ae9746f3e4d2f579f73d4cf6628c3b2d80bf201cf8fc79033bf68f89"
          for kind in broad global narrow; do
            file="OBS_084_F444W_${kind}_PSF.fits"
            curl --fail --location --retry 5 --retry-delay 2 "$PSF_ROOT/$file" -o "published_psf/$file"
            printf '%s  %s\n' "${expected[$kind]}" "published_psf/$file" | sha256sum --check --strict
          done
      - name: Run paired-difference published-PSF mismatch oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate_d_published_psf_paired_oracle
          python scripts/run_gate_d_cosmosweb_published_psf_paired_oracle.py \
            --injected-fits injection_artifact/injected_scenes.fits \
            --injection-summary injection_artifact/summary.json \
            --psf-dir published_psf \
            --out-json gate_d_published_psf_paired_oracle/summary.json \
            2>&1 | tee gate_d_published_psf_paired_oracle/stdout.txt
          python -m pip freeze > gate_d_published_psf_paired_oracle/pip-freeze.txt
          cat gate_d_published_psf_paired_oracle/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-d-cosmosweb-published-psf-paired-oracle
          path: gate_d_published_psf_paired_oracle/
          if-no-files-found: warn
