name: gate-c-agn-imfit-renderer
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_imfit_renderer.py
      - tests/test_agn_imfit_renderer.py
      - benchmarks/zhuang_shen_2024/C5H_PROTOCOL.md
      - .github/workflows/gate-c-agn-imfit-renderer.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-imfit-renderer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  renderer-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_n: [1, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - name: Install checksum-pinned author makeimage binary
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/imfit-c5h"
          mkdir -p "$package_dir"
          curl --fail --location --retry 2 --max-time 120 \
            https://www.mpe.mpg.de/~erwin/resources/imfit/binaries/imfit-1.9.0-linux-64.tar.gz \
            --output "$package_dir/imfit.tar.gz"
          printf '9eb10a62baab87de98744c247f7a10ea02b05d32996760b7cef100f5f02a7089  %s\n' \
            "$package_dir/imfit.tar.gz" | sha256sum --check -
          tar --no-same-owner -xzf "$package_dir/imfit.tar.gz" -C "$package_dir"
          binary="$package_dir/imfit-1.9.0/makeimage"
          printf '4fe27a3d3e48f0c4931ee3fb5ad571330fdbf27f6c327f48990418bdcb965984  %s\n' \
            "$binary" | sha256sum --check -
          echo "IMFIT_MAKEIMAGE=$binary" >> "$GITHUB_ENV"
      - run: python -m pytest -q tests/test_agn_imfit_renderer.py tests/test_agn_empirical_psf_transfer.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-empirical-agn-centroid-n${{ matrix.host_n }}
          run-id: 33740141863
          github-token: ${{ github.token }}
          path: parent-centroid
      - name: Frozen Imfit renderer preflight
        run: python scripts/run_agn_imfit_renderer.py --source parent-centroid --makeimage "$IMFIT_MAKEIMAGE" --host-n ${{ matrix.host_n }} --out imfit-renderer-output
      - if: always()
        run: |
          mkdir -p imfit-renderer-output
          git rev-parse HEAD > imfit-renderer-output/commit.txt
          python -m pip freeze > imfit-renderer-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-imfit-renderer-n${{ matrix.host_n }}
          path: imfit-renderer-output
