name: gate-c-agn-fourier-grid
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_fourier_grid.py
      - tests/test_agn_fourier_grid.py
      - benchmarks/zhuang_shen_2024/C5K_PROTOCOL.md
      - .github/workflows/gate-c-agn-fourier-grid.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-fourier-grid-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fourier-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_n: [1, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - run: python -m pytest -q tests/test_agn_fourier_grid.py tests/test_agn_fourier_controls.py tests/test_agn_compact_renderer.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-compact-renderer-n${{ matrix.host_n }}
          run-id: 33766246396
          github-token: ${{ github.token }}
          path: parent-renderer
      - name: Frozen bounded Fourier-grid diagnosis
        run: python scripts/run_agn_fourier_grid.py --source parent-renderer --host-n ${{ matrix.host_n }} --out fourier-grid-output
      - if: always()
        run: |
          mkdir -p fourier-grid-output
          git rev-parse HEAD > fourier-grid-output/commit.txt
          python -m pip freeze > fourier-grid-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-fourier-grid-n${{ matrix.host_n }}
          path: fourier-grid-output
