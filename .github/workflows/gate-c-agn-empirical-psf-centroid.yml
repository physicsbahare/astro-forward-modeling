name: gate-c-agn-empirical-psf-centroid
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_empirical_psf_centroid.py
      - tests/test_agn_empirical_psf_centroid.py
      - .github/workflows/gate-c-agn-empirical-psf-centroid.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-empirical-centroid-${{ github.ref }}
  cancel-in-progress: false
jobs:
  centroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: [A, B]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - run: python -m pytest -q tests/test_agn_empirical_psf_centroid.py tests/test_agn_empirical_psf_phase.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-empirical-psf-phase-${{ matrix.module }}
          run-id: 33727185586
          github-token: ${{ github.token }}
          path: parent-phase
      - run: python scripts/run_agn_empirical_psf_centroid.py --source parent-phase --module ${{ matrix.module }} --out centroid-output
      - if: always()
        run: |
          mkdir -p centroid-output
          git rev-parse HEAD > centroid-output/commit.txt
          python -m pip freeze > centroid-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-empirical-psf-centroid-${{ matrix.module }}
          path: centroid-output
