name: gate-d-cosmosweb-published-empirical-psf
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - benchmarks/gate_d/COSMOSWEB_D1_PUBLISHED_EMPIRICAL_PSF_PROTOCOL.md
      - scripts/run_gate_d_cosmosweb_published_empirical_psf.py
      - tests/test_gate_d_cosmosweb_published_empirical_psf.py
      - .github/workflows/gate-d-cosmosweb-published-empirical-psf.yml
permissions:
  contents: read
concurrency:
  group: gate-d-cosmosweb-published-empirical-psf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  published-empirical-psf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STPSF_DATA_VERSION: "2.2.0"
      STPSF_DATA_URL: "https://stsci.box.com/shared/static/mjst9j056ibf2uph4gxy8qxmi89tjzwk.gz"
      STPSF_DATA_SHA256: "bbdfbe7c5aa7ee7fdb60efed13720ba3e0619c976b77aa0d63941dd59a4b6a98"
      PSF_ROOT: "https://ariel.astro.illinois.edu/cosmos_web/nircam/psf"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]' astropy scipy
      - run: python -m pip install -r requirements-crosscode-jwst-stpsf.txt
      - run: python -m pytest -q tests/test_gate_d_cosmosweb_published_empirical_psf.py
      - name: Download exact pinned STPSF reference data
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stpsf-data-${STPSF_DATA_VERSION}.tar.gz"
          root="$RUNNER_TEMP/stpsf-reference"; mkdir -p "$root"
          curl --fail --location --retry 5 --retry-delay 2 "$STPSF_DATA_URL" -o "$archive"
          printf '%s  %s\n' "$STPSF_DATA_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$root"
          data_dir="$(dirname "$(find "$root" -type f -name version.txt -print -quit)")"
          test "$(cat "$data_dir/version.txt")" = "$STPSF_DATA_VERSION"
          echo "STPSF_PATH=$data_dir" >> "$GITHUB_ENV"
      - name: Download published COSMOS-Web OBS_084 F444W PSFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published_psf
          for kind in broad global narrow; do
            file="OBS_084_F444W_${kind}_PSF.fits"
            curl --fail --location --retry 5 --retry-delay 2 "$PSF_ROOT/$file" -o "published_psf/$file"
            test -s "published_psf/$file"
            sha256sum "published_psf/$file"
          done
      - name: Run published empirical-PSF bracket
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate_d_published_empirical_psf
          python scripts/run_gate_d_cosmosweb_published_empirical_psf.py \
            --psf-dir published_psf \
            --matrix benchmarks/gate_d/COSMOSWEB_D1_INJECTION_MATRIX.json \
            --out-json gate_d_published_empirical_psf/summary.json \
            2>&1 | tee gate_d_published_empirical_psf/stdout.txt
          python -m pip freeze > gate_d_published_empirical_psf/pip-freeze.txt
          cat gate_d_published_empirical_psf/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-d-cosmosweb-published-empirical-psf
          path: gate_d_published_empirical_psf/
          if-no-files-found: warn
