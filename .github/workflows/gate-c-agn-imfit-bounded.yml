name: gate-c-agn-imfit-bounded
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_imfit_bounded.py
      - scripts/audit_agn_imfit_bounded.py
      - tests/test_agn_imfit_bounded.py
      - benchmarks/zhuang_shen_2024/C5N_PROTOCOL.md
      - .github/workflows/gate-c-agn-imfit-bounded.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-imfit-bounded-${{ github.ref }}
  cancel-in-progress: false
jobs:
  imfit-bounded:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_n: [1, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - name: Install unchanged checksum-pinned author binary
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/imfit-c5n"
          mkdir -p "$package_dir"
          curl --fail --location --retry 2 --max-time 120 \
            https://www.mpe.mpg.de/~erwin/resources/imfit/binaries/imfit-1.9.0-linux-64.tar.gz \
            --output "$package_dir/imfit.tar.gz"
          printf '9eb10a62baab87de98744c247f7a10ea02b05d32996760b7cef100f5f02a7089  %s\n' \
            "$package_dir/imfit.tar.gz" | sha256sum --check -
          tar --no-same-owner -xzf "$package_dir/imfit.tar.gz" -C "$package_dir"
          binary="$package_dir/imfit-1.9.0/makeimage"
          printf '4fe27a3d3e48f0c4931ee3fb5ad571330fdbf27f6c327f48990418bdcb965984  %s\n' \
            "$binary" | sha256sum --check -
          echo "IMFIT_MAKEIMAGE=$binary" >> "$GITHUB_ENV"
      - name: Require the pinned science environment before testing
        run: |
          python -c "import importlib.metadata as m; import astropy, galsim, photutils; import sys; sys.path.insert(0, 'scripts'); from run_agn_imfit_renderer import PINS; assert {k:m.version(k) for k in PINS} == PINS"
      - run: python -m pytest -q tests/test_agn_imfit_bounded.py tests/test_agn_imfit_refinement.py tests/test_agn_imfit_renderer.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-cell-response-n${{ matrix.host_n }}
          run-id: 33798675379
          github-token: ${{ github.token }}
          path: parent-cell
      - name: Frozen Imfit refinement
        run: python scripts/run_agn_imfit_bounded.py --source parent-cell --makeimage "$IMFIT_MAKEIMAGE" --host-n ${{ matrix.host_n }} --out imfit-bounded-output
      - name: Read-only full output audit
        run: python scripts/audit_agn_imfit_bounded.py --source imfit-bounded-output --host-n ${{ matrix.host_n }} --output imfit-bounded-output/audit.json
      - if: always()
        run: |
          mkdir -p imfit-bounded-output
          git rev-parse HEAD > imfit-bounded-output/commit.txt
          python -m pip freeze > imfit-bounded-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-imfit-bounded-n${{ matrix.host_n }}
          path: imfit-bounded-output
