name: gate-c-agn-imfit-wrong-psf-free-shape
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_imfit_wrong_psf_free_shape.py
      - scripts/audit_agn_imfit_wrong_psf_free_shape.py
      - tests/test_agn_imfit_wrong_psf_free_shape.py
      - benchmarks/zhuang_shen_2024/C5R_PROTOCOL.md
      - benchmarks/zhuang_shen_2024/c5q_33830661656.json
      - .github/workflows/gate-c-agn-imfit-wrong-psf-free-shape.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-imfit-wrong-psf-free-shape-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wrong-psf-free-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        host_n: [1, 4]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - name: Install checksum-pinned author fitter
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/imfit-c5r"
          mkdir -p "$package_dir"
          curl --fail --location --retry 2 --max-time 120 \
            https://www.mpe.mpg.de/~erwin/resources/imfit/binaries/imfit-1.9.0-linux-64.tar.gz \
            --output "$package_dir/imfit.tar.gz"
          printf '9eb10a62baab87de98744c247f7a10ea02b05d32996760b7cef100f5f02a7089  %s\n' \
            "$package_dir/imfit.tar.gz" | sha256sum --check -
          tar --no-same-owner -xzf "$package_dir/imfit.tar.gz" -C "$package_dir"
          binary="$package_dir/imfit-1.9.0/imfit"
          printf '57cc48293aeb25e92ed82f600d2c7e15022c81fd0172970648a9ac7a241f7103  %s\n' \
            "$binary" | sha256sum --check -
          echo "IMFIT_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Require the exact pinned science environment
        run: python -c "import importlib.metadata as m; import astropy, galsim, photutils; import sys; sys.path.insert(0, 'scripts'); from run_agn_empirical_psf_transfer import PINS; assert {k:m.version(k) for k in PINS} == PINS"
      - run: python -m pytest -q tests/test_agn_imfit_wrong_psf_free_shape.py tests/test_agn_imfit_free_shape.py tests/test_agn_imfit_renderer.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-empirical-psf-transfer-n${{ matrix.host_n }}
          run-id: 33717899427
          github-token: ${{ github.token }}
          path: parent-c5d
      - name: Frozen wrong-PSF free-shape diagnostic
        run: python scripts/run_agn_imfit_wrong_psf_free_shape.py --source parent-c5d --imfit "$IMFIT_BINARY" --host-n ${{ matrix.host_n }} --out imfit-wrong-psf-free-shape-output
      - name: Read-only complete attempt and algebra audit
        run: python scripts/audit_agn_imfit_wrong_psf_free_shape.py --source imfit-wrong-psf-free-shape-output --host-n ${{ matrix.host_n }} --output imfit-wrong-psf-free-shape-output/audit.json
      - if: always()
        run: |
          mkdir -p imfit-wrong-psf-free-shape-output
          git rev-parse HEAD > imfit-wrong-psf-free-shape-output/commit.txt
          python -m pip freeze > imfit-wrong-psf-free-shape-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-imfit-wrong-psf-free-shape-n${{ matrix.host_n }}
          path: imfit-wrong-psf-free-shape-output
          if-no-files-found: error
