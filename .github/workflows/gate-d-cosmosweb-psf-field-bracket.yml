name: gate-d-cosmosweb-psf-field-bracket
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - benchmarks/gate_d/COSMOSWEB_D1_PSF_FIELD_BRACKET_PROTOCOL.md
      - scripts/run_gate_d_cosmosweb_real_injection.py
      - scripts/run_gate_d_cosmosweb_psf_field_bracket.py
      - tests/test_gate_d_cosmosweb_psf_field_bracket.py
      - .github/workflows/gate-d-cosmosweb-psf-field-bracket.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gate-d-cosmosweb-psf-field-bracket-${{ github.ref }}
  cancel-in-progress: false
jobs:
  psf-field-bracket:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      STPSF_DATA_VERSION: "2.2.0"
      STPSF_DATA_URL: "https://stsci.box.com/shared/static/mjst9j056ibf2uph4gxy8qxmi89tjzwk.gz"
      STPSF_DATA_SHA256: "bbdfbe7c5aa7ee7fdb60efed13720ba3e0619c976b77aa0d63941dd59a4b6a98"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install -r requirements-crosscode-jwst-stpsf.txt
      - run: python -m pytest -q tests/test_gate_d_cosmosweb_psf_field_bracket.py
      - name: Download exact pinned STPSF reference data
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stpsf-data-${STPSF_DATA_VERSION}.tar.gz"
          root="$RUNNER_TEMP/stpsf-reference"; mkdir -p "$root"
          curl --fail --location --retry 5 --retry-delay 2 "$STPSF_DATA_URL" -o "$archive"
          printf '%s  %s\n' "$STPSF_DATA_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$root"
          data_dir="$(dirname "$(find "$root" -type f -name version.txt -print -quit)")"
          test "$(cat "$data_dir/version.txt")" = "$STPSF_DATA_VERSION"
          echo "STPSF_PATH=$data_dir" >> "$GITHUB_ENV"
      - name: Download frozen successful D1d injection artifact
        run: |
          mkdir -p injection_artifact
          gh run download 33949290838 -n gate-d-cosmosweb-real-injection -D injection_artifact
          test -s injection_artifact/summary.json
      - name: Run STPSF detector-field bracket
        run: |
          mkdir -p gate_d_psf_field_bracket
          python scripts/run_gate_d_cosmosweb_psf_field_bracket.py \
            --injection-summary injection_artifact/summary.json \
            --out-json gate_d_psf_field_bracket/summary.json \
            | tee gate_d_psf_field_bracket/stdout.txt
          python -m pip freeze > gate_d_psf_field_bracket/pip-freeze.txt
          echo '--- D1n-a summary.json ---'
          cat gate_d_psf_field_bracket/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-d-cosmosweb-psf-field-bracket
          path: gate_d_psf_field_bracket/
          if-no-files-found: warn
