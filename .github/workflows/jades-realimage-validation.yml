name: JADES real-image notebook validation

on:
  push:
    branches: [jades-realimage-batch]
    paths:
      - 'JADES_realimage_artificial_redshifting_batch.ipynb'
      - 'README_JADES_realimage_artificial_redshifting.md'
      - 'requirements-jades-realimage-redshifting.txt'
      - '.github/workflows/jades-realimage-validation.yml'
      - 'tests/validate_jades_realimage_notebook.py'
  workflow_dispatch:

jobs:
  static-notebook-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate notebook JSON, settings boundary, and Python syntax
        run: |
          python - <<'PY'
          import ast, json, pathlib, sys

          p = pathlib.Path("JADES_realimage_artificial_redshifting_batch.ipynb")
          nb = json.loads(p.read_text())
          assert nb["nbformat"] == 4
          assert len(nb["cells"]) >= 10

          code_cells = []
          settings_cells = []
          for i, cell in enumerate(nb["cells"]):
              src = "".join(cell.get("source", []))
              if cell.get("cell_type") == "code":
                  code_cells.append((i, src))
                  if "USER SETTINGS - EDIT ONLY THIS CELL" in src:
                      settings_cells.append(i)
                  try:
                      ast.parse(src, filename=f"cell_{i}.py")
                  except SyntaxError as exc:
                      print(f"Syntax error in cell {i}: {exc}")
                      raise

          assert len(settings_cells) == 1, settings_cells

          full = "\n".join(src for _, src in code_cells)

          required_phrases = [
              "source_real_pixels",
              "analytic_source_model_used",
              "inu_redshift_factor",
              "angular_scale_factor",
              "find_auto_blank",
              "run_pysersic_fit",
              "SOURCE_NOISE_MC_DRAWS",
              "memmap=True",
              "batch_summary.csv",
          ]
          for phrase in required_phrases:
              assert phrase in full, phrase

          forbidden = [
              "render_sersic(",
              "LUMINOSITY_EVOLUTION_FACTOR",
              "SIZE_EVOLUTION",
          ]
          for phrase in forbidden:
              assert phrase not in full, phrase

          # Large mosaics must be sliced before conversion to ndarray.
          suspicious = [
              "np.asarray(hdu.data)",
              "np.array(hdu.data,",
              "np.asarray(h.data)",
          ]
          # A full PSF is intentionally copied; image mosaics are not.
          for phrase in suspicious:
              assert phrase not in full, f"Full-mosaic materialization pattern found: {phrase}"

          for phrase in [
              "SUBTRACT_LOCAL_TARGET_BACKGROUND = False",
              "REFERENCE_MORPHOLOGY_COLUMNS",
              "source_product_has_coverage",
              "refit_mask_semantics",
          ]:
              assert phrase in full, phrase

          print("Notebook static validation PASS")
          print("cells:", len(nb["cells"]), "code:", len(code_cells),
                "settings cell:", settings_cells[0])
          PY

      - name: README consistency checks
        run: |
          python - <<'PY'
          import pathlib
          t = pathlib.Path("README_JADES_realimage_artificial_redshifting.md").read_text()
          for phrase in [
              "real multi-band source pixels",
              "PySersic",
              "one settings cell",
              "does **not** draw it again",
              "does not reconstruct full drizzle covariance",
          ]:
              assert phrase in t, phrase
          print("README static validation PASS")
          PY


  pysersic-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PySersic API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<3" "scipy>=1.11" "astropy>=6" "photutils>=2" "pysersic>=0.1.3"

      - name: Check the JADES-fit API contract used by the notebook
        run: |
          python - <<'PY'
          import numpy as np
          from pysersic.priors import SourceProperties
          from pysersic import FitSingle
          from pysersic.loss import gaussian_loss

          n = 31
          yy, xx = np.indices((n, n))
          rr2 = (xx - 15.0)**2 + (yy - 15.0)**2
          image = np.exp(-0.5 * rr2 / 3.0**2)
          rms = np.full_like(image, 0.05)
          support = rr2 <= 9.0**2
          mask = ~support
          psf = np.exp(-0.5 * ((xx-15.0)**2 + (yy-15.0)**2) / 1.0**2)[11:20,11:20]
          psf /= psf.sum()

          props = SourceProperties(image=image, mask=mask)
          prior = props.generate_prior("sersic", sky_type="none")
          prior.set_uniform_prior("n", 0.65, 8.0)
          prior.set_uniform_prior("ellip", 0.0, 0.9)
          prior.set_uniform_prior("theta", 0.0, 2*np.pi)
          assert prior.check_vars()

          fitter = FitSingle(data=image, rms=rms, psf=psf, prior=prior,
                             mask=mask, loss_func=gaussian_loss)
          assert fitter.prior is not None
          print("PySersic construction/API smoke PASS")
          PY

  synthetic-runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-jades-realimage-redshifting.txt

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-jades-realimage-redshifting.txt

      - name: Run synthetic real-pixel forward and PySersic MAP recovery
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          MPLBACKEND: Agg
        run: |
          python tests/validate_jades_realimage_notebook.py

