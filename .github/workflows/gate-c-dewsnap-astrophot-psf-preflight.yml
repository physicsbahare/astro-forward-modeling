name: gate-c-dewsnap-astrophot-psf-preflight
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - requirements-dewsnap-astrophot.txt
      - scripts/run_dewsnap_astrophot_psf_preflight.py
      - scripts/audit_dewsnap_astrophot_psf_preflight.py
      - tests/test_dewsnap_astrophot_psf_preflight.py
      - benchmarks/dewsnap_2025/C6A_PROTOCOL.md
      - benchmarks/zhuang_shen_2024/c5r_33842347328.json
      - .github/workflows/gate-c-dewsnap-astrophot-psf-preflight.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: dewsnap-astrophot-psf-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-psf-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dewsnap-astrophot.txt
      - name: Install pinned CPU runtime and AstroPhot
        run: |
          python -m pip install 'torch==2.14.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dewsnap-astrophot.txt -e '.[test]'
      - name: Require exact selected versions
        run: python -c "import importlib.metadata as m, torch; assert m.version('astrophot') == '0.18.0'; assert torch.__version__ == '2.14.0+cpu'"
      - run: python -m pytest -q tests/test_dewsnap_astrophot_psf_preflight.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-imfit-wrong-psf-free-shape-n1
          run-id: 33842347328
          github-token: ${{ github.token }}
          path: parent-c5r
      - name: Frozen signed-PSF compatibility preflight
        run: python scripts/run_dewsnap_astrophot_psf_preflight.py --source parent-c5r --out dewsnap-astrophot-preflight-output
      - name: Read-only output audit
        run: python scripts/audit_dewsnap_astrophot_psf_preflight.py --source dewsnap-astrophot-preflight-output
      - if: always()
        run: |
          mkdir -p dewsnap-astrophot-preflight-output
          git rev-parse HEAD > dewsnap-astrophot-preflight-output/commit.txt
          python -m pip freeze > dewsnap-astrophot-preflight-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dewsnap-astrophot-psf-preflight
          path: dewsnap-astrophot-preflight-output
          if-no-files-found: error
