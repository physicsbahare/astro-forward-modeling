name: gate-c-paulino-afonso-high-n-pixel-integration-surface

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/run_paulino_afonso_high_n_pixel_integration_surface.py'
      - 'scripts/run_paulino_afonso_full_chain_califa.py'
      - 'verification/paulino_afonso_sersic_floor.py'
      - '.github/workflows/gate-c-paulino-afonso-high-n-pixel-integration-surface.yml'
  workflow_dispatch:

jobs:
  high-n-pixel-integration-surface:
    # Routing only; skipped jobs are NOT new scientific results. See docs/VERIFICATION_CI_ROUTING.md.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.number == 5 && github.event.pull_request.draft) && !(github.event_name == 'push' && github.ref == 'refs/heads/verification-v0.1' && github.event.before == '88f3fb646a0b89e6cb9b8b8ee1aacae377edca56' && contains(github.event.head_commit.message, '[C5e isolated]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        z_target: ['0.40', '0.84', '1.47', '2.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification harness
        run: python -m pip install -e '.[test]'
      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-high-n-pixel-integration-pip-freeze.txt
      - name: Compare point-sampled and pixel-integrated high-n objective surfaces
        run: python scripts/run_paulino_afonso_high_n_pixel_integration_surface.py --z-target ${{ matrix.z_target }}
      - name: Upload objective-surface metrics and provenance
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-high-n-pixel-integration-z-${{ matrix.z_target }}
          path: |
            gate-c-paulino-afonso-high-n-pixel-integration-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/high_n_pixel_integration_surface/
