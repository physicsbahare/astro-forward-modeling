name: gate-c-paulino-afonso-full-chain-noisy-morphology

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-chain-noisy-morphology:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification harness
        run: python -m pip install -e '.[test]'
      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-full-chain-noisy-morphology-pip-freeze.txt
      - name: Recover morphology from noisy degraded CALIFA-like images
        run: python scripts/run_paulino_afonso_full_chain_noisy_morphology.py
      - name: Upload noisy morphology metrics and provenance
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-full-chain-noisy-morphology
          path: |
            gate-c-paulino-afonso-full-chain-noisy-morphology-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/full_chain_noisy_morphology/
