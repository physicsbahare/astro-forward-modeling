name: gate-c-yu-2023

on:
  push:
    branches:
      - verification-v0.1
    paths:
      - "verification/yu_2023.py"
      - "tests/test_yu_2023.py"
      - "scripts/run_yu_2023_anchor_benchmark.py"
      - "scripts/run_yu_2023_psf_only_resolvedness.py"
      - "benchmarks/yu_2023/**"
      - ".github/workflows/gate-c-yu-2023.yml"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - "verification/yu_2023.py"
      - "tests/test_yu_2023.py"
      - "scripts/run_yu_2023_anchor_benchmark.py"
      - "scripts/run_yu_2023_psf_only_resolvedness.py"
      - "benchmarks/yu_2023/**"
      - ".github/workflows/gate-c-yu-2023.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  yu-2023-psf-only-noiseless:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification harness
        run: python -m pip install -e ".[test]"

      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-yu-2023-pip-freeze.txt

      - name: Test frozen Yu et al. definitions and anchors
        run: pytest -q tests/test_yu_2023.py

      - name: Generate machine-readable Yu et al. anchor report
        run: python scripts/run_yu_2023_anchor_benchmark.py

      - name: Run PSF-only noiseless resolvedness sweep
        run: python scripts/run_yu_2023_psf_only_resolvedness.py

      - name: Upload Yu et al. Stage-1 metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-yu-2023
          path: |
            gate-c-yu-2023-pip-freeze.txt
            benchmark_output/yu_2023/
          if-no-files-found: warn
