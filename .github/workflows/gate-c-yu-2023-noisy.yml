name: gate-c-yu-2023-noisy

on:
  push:
    branches:
      - verification-v0.1
    paths:
      - "verification/yu_2023.py"
      - "tests/test_yu_2023.py"
      - "tests/test_yu_2023_noise.py"
      - "scripts/run_yu_2023_psf_only_resolvedness.py"
      - "scripts/run_yu_2023_noisy_resolvedness.py"
      - "benchmarks/yu_2023/**"
      - ".github/workflows/gate-c-yu-2023-noisy.yml"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - "verification/yu_2023.py"
      - "tests/test_yu_2023.py"
      - "tests/test_yu_2023_noise.py"
      - "scripts/run_yu_2023_psf_only_resolvedness.py"
      - "scripts/run_yu_2023_noisy_resolvedness.py"
      - "benchmarks/yu_2023/**"
      - ".github/workflows/gate-c-yu-2023-noisy.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  yu-2023-noisy-resolvedness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        aperture_snr: [10, 30, 100]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification harness
        run: python -m pip install -e ".[test]"

      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-yu-2023-noisy-pip-freeze.txt

      - name: Test Yu et al. noise-correction definitions
        run: pytest -q tests/test_yu_2023.py tests/test_yu_2023_noise.py

      - name: Run controlled noisy resolvedness shard
        run: python scripts/run_yu_2023_noisy_resolvedness.py --aperture-snr ${{ matrix.aperture_snr }}

      - name: Upload noisy resolvedness metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-yu-2023-noisy-snr-${{ matrix.aperture_snr }}
          path: |
            gate-c-yu-2023-noisy-pip-freeze.txt
            benchmark_output/yu_2023/noisy_resolvedness/snr_${{ matrix.aperture_snr }}/
          if-no-files-found: warn
