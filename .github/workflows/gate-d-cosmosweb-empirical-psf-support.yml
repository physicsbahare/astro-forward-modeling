name: gate-d-cosmosweb-empirical-psf-support
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - benchmarks/gate_d/COSMOSWEB_D1_EMPIRICAL_PSF_SUPPORT_PROTOCOL.md
      - scripts/run_gate_d_cosmosweb_empirical_psf_support.py
      - tests/test_gate_d_cosmosweb_empirical_psf_support.py
      - .github/workflows/gate-d-cosmosweb-empirical-psf-support.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: gate-d-cosmosweb-empirical-psf-support-${{ github.ref }}
  cancel-in-progress: false
jobs:
  empirical-psf-support:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      STPSF_DATA_VERSION: "2.2.0"
      STPSF_DATA_URL: "https://stsci.box.com/shared/static/mjst9j056ibf2uph4gxy8qxmi89tjzwk.gz"
      STPSF_DATA_SHA256: "bbdfbe7c5aa7ee7fdb60efed13720ba3e0619c976b77aa0d63941dd59a4b6a98"
      REAL_CUTOUT_SHA256: "764d542f2417810c904bce711455b3eb69c70cf388f97348cb857b056b2dd66d"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]' astropy scipy
      - run: python -m pip install -r requirements-crosscode-jwst-stpsf.txt
      - run: python -m pytest -q tests/test_gate_d_cosmosweb_empirical_psf_support.py
      - name: Download exact pinned STPSF reference data
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stpsf-data-${STPSF_DATA_VERSION}.tar.gz"
          root="$RUNNER_TEMP/stpsf-reference"; mkdir -p "$root"
          curl --fail --location --retry 5 --retry-delay 2 "$STPSF_DATA_URL" -o "$archive"
          printf '%s  %s\n' "$STPSF_DATA_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$root"
          data_dir="$(dirname "$(find "$root" -type f -name version.txt -print -quit)")"
          test "$(cat "$data_dir/version.txt")" = "$STPSF_DATA_VERSION"
          echo "STPSF_PATH=$data_dir" >> "$GITHUB_ENV"
      - name: Download frozen real COSMOS-Web cutout
        run: |
          mkdir -p real_cutout
          gh run download 33941326833 -n gate-d-cosmosweb-real-cutout -D real_cutout
          test -s real_cutout/cosmosweb_f444w_30mas_A1_ID4204_real_cutout.fits
          printf '%s  %s\n' "$REAL_CUTOUT_SHA256" real_cutout/cosmosweb_f444w_30mas_A1_ID4204_real_cutout.fits | sha256sum --check --strict
      - name: Run empirical point-source support audit
        run: |
          mkdir -p gate_d_empirical_psf_support
          python scripts/run_gate_d_cosmosweb_empirical_psf_support.py --real-fits real_cutout/cosmosweb_f444w_30mas_A1_ID4204_real_cutout.fits --matrix benchmarks/gate_d/COSMOSWEB_D1_INJECTION_MATRIX.json --out-json gate_d_empirical_psf_support/summary.json --out-npz gate_d_empirical_psf_support/stamps_and_stack.npz | tee gate_d_empirical_psf_support/stdout.txt
          python -m pip freeze > gate_d_empirical_psf_support/pip-freeze.txt
          echo '--- D1n-b summary.json ---'; cat gate_d_empirical_psf_support/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-d-cosmosweb-empirical-psf-support
          path: gate_d_empirical_psf_support/
          if-no-files-found: warn
