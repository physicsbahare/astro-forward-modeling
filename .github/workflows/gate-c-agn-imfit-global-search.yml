name: gate-c-agn-imfit-global-search
on:
  workflow_dispatch:
  push:
    branches: [verification-v0.1]
    paths:
      - scripts/run_agn_imfit_global_search.py
      - scripts/audit_agn_imfit_global_search.py
      - tests/test_agn_imfit_global_search.py
      - benchmarks/zhuang_shen_2024/C5Q_PROTOCOL.md
      - benchmarks/zhuang_shen_2024/c5p_33823405733.json
      - .github/workflows/gate-c-agn-imfit-global-search.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: agn-imfit-global-search-${{ github.ref }}
  cancel-in-progress: false
jobs:
  global-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: [A, B]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agn-empirical-psf-phase.txt -e '.[test]'
      - name: Install checksum-pinned author fitter
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/imfit-c5q"
          mkdir -p "$package_dir"
          curl --fail --location --retry 2 --max-time 120 \
            https://www.mpe.mpg.de/~erwin/resources/imfit/binaries/imfit-1.9.0-linux-64.tar.gz \
            --output "$package_dir/imfit.tar.gz"
          printf '9eb10a62baab87de98744c247f7a10ea02b05d32996760b7cef100f5f02a7089  %s\n' \
            "$package_dir/imfit.tar.gz" | sha256sum --check -
          tar --no-same-owner -xzf "$package_dir/imfit.tar.gz" -C "$package_dir"
          binary="$package_dir/imfit-1.9.0/imfit"
          printf '57cc48293aeb25e92ed82f600d2c7e15022c81fd0172970648a9ac7a241f7103  %s\n' \
            "$binary" | sha256sum --check -
          echo "IMFIT_BINARY=$binary" >> "$GITHUB_ENV"
      - name: Require the exact pinned science environment
        run: python -c "import importlib.metadata as m; import astropy, galsim, photutils; import sys; sys.path.insert(0, 'scripts'); from run_agn_empirical_psf_transfer import PINS; assert {k:m.version(k) for k in PINS} == PINS"
      - run: python -m pytest -q tests/test_agn_imfit_global_search.py tests/test_agn_imfit_optimizer_path.py
      - uses: actions/download-artifact@v4
        with:
          name: agn-imfit-optimizer-path-${{ matrix.module }}
          run-id: 33823405733
          github-token: ${{ github.token }}
          path: parent-c5p
      - name: Frozen seeded global-search diagnostic
        run: python scripts/run_agn_imfit_global_search.py --source parent-c5p --imfit "$IMFIT_BINARY" --module ${{ matrix.module }} --out imfit-global-search-output
      - name: Read-only complete output audit
        run: python scripts/audit_agn_imfit_global_search.py --source imfit-global-search-output --module ${{ matrix.module }} --output imfit-global-search-output/audit.json
      - if: always()
        run: |
          mkdir -p imfit-global-search-output
          git rev-parse HEAD > imfit-global-search-output/commit.txt
          python -m pip freeze > imfit-global-search-output/pip-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agn-imfit-global-search-${{ matrix.module }}
          path: imfit-global-search-output
          if-no-files-found: error
