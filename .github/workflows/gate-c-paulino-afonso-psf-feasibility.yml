name: gate-c-paulino-afonso-psf-feasibility

on:
  push:
    branches:
      - verification-v0.1
    paths:
      - "scripts/run_paulino_afonso_psf_feasibility_audit.py"
      - "verification/paulino_afonso_sersic_floor.py"
      - ".github/workflows/gate-c-paulino-afonso-psf-feasibility.yml"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_paulino_afonso_psf_feasibility_audit.py"
      - "verification/paulino_afonso_sersic_floor.py"
      - ".github/workflows/gate-c-paulino-afonso-psf-feasibility.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  psf-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification harness
        run: python -m pip install -e ".[test]"

      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-psf-feasibility-pip-freeze.txt

      - name: Audit source-to-target PSF feasibility
        run: python scripts/run_paulino_afonso_psf_feasibility_audit.py

      - name: Upload PSF feasibility metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-psf-feasibility
          path: |
            gate-c-paulino-afonso-psf-feasibility-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/psf_feasibility/
          if-no-files-found: warn
