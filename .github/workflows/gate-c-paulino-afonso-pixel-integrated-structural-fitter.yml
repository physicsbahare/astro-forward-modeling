name: gate-c-paulino-afonso-pixel-integrated-structural-fitter

on:
  pull_request:
    paths:
      - 'scripts/run_paulino_afonso_pixel_integrated_structural_fitter.py'
      - 'scripts/run_paulino_afonso_high_n_pixel_integration_surface.py'
      - 'scripts/run_paulino_afonso_full_chain_califa.py'
      - 'verification/paulino_afonso_sersic_floor.py'
      - '.github/workflows/gate-c-paulino-afonso-pixel-integrated-structural-fitter.yml'
  workflow_dispatch:

jobs:
  pixel-integrated-structural-fitter:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        z_target: ['0.40', '0.84', '1.47', '2.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verification harness
        run: python -m pip install -e '.[test]'
      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-pixel-integrated-structural-fitter-pip-freeze.txt
      - name: Fit concentrated high-n scene with 4x pixel-integrated renderer
        run: python scripts/run_paulino_afonso_pixel_integrated_structural_fitter.py --z-target ${{ matrix.z_target }}
      - name: Upload pixel-integrated structural-fit metrics and provenance
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-pixel-integrated-structural-fitter-z-${{ matrix.z_target }}
          path: |
            gate-c-paulino-afonso-pixel-integrated-structural-fitter-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/pixel_integrated_structural_fitter/
