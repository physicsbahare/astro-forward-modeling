name: gate-c-paulino-afonso-noisy-operational

on:
  push:
    branches:
      - verification-v0.1
    paths:
      - "scripts/run_paulino_afonso_noisy_operational_multistart.py"
      - "verification/paulino_afonso_sersic_floor.py"
      - ".github/workflows/gate-c-paulino-afonso-noisy-operational.yml"
      - "pyproject.toml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_paulino_afonso_noisy_operational_multistart.py"
      - "verification/paulino_afonso_sersic_floor.py"
      - ".github/workflows/gate-c-paulino-afonso-noisy-operational.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  noisy-operational-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification harness
        run: python -m pip install -e ".[test]"

      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-noisy-operational-pip-freeze.txt

      - name: Run controlled noisy operational multistart ensemble
        run: python scripts/run_paulino_afonso_noisy_operational_multistart.py

      - name: Upload noisy operational metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-noisy-operational
          path: |
            gate-c-paulino-afonso-noisy-operational-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/noisy_operational_multistart/
          if-no-files-found: warn
