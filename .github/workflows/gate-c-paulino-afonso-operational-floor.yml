name: gate-c-paulino-afonso-operational-floor

on:
  push:
    branches:
      - verification-v0.1
    paths:
      - "scripts/run_paulino_afonso_operational_multistart.py"
      - ".github/workflows/gate-c-paulino-afonso-operational-floor.yml"
      - "verification/paulino_afonso_sersic_floor.py"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - "scripts/run_paulino_afonso_operational_multistart.py"
      - ".github/workflows/gate-c-paulino-afonso-operational-floor.yml"
      - "verification/paulino_afonso_sersic_floor.py"
  workflow_dispatch:

jobs:
  operational-multistart-noiseless-floor:
    # Routing only; skipped jobs are NOT new scientific results. See docs/VERIFICATION_CI_ROUTING.md.
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.number == 5 && github.event.pull_request.draft) && !(github.event_name == 'push' && github.ref == 'refs/heads/verification-v0.1' && github.event.before == '88f3fb646a0b89e6cb9b8b8ee1aacae377edca56' && contains(github.event.head_commit.message, '[C5e isolated]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verification harness
        run: python -m pip install -e ".[test]"
      - name: Record software provenance
        run: python -m pip freeze | tee gate-c-paulino-afonso-operational-floor-pip-freeze.txt
      - name: Run truth-independent operational multistart floor
        run: python scripts/run_paulino_afonso_operational_multistart.py
      - name: Upload operational-floor metrics and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-paulino-afonso-operational-floor
          path: |
            gate-c-paulino-afonso-operational-floor-pip-freeze.txt
            benchmark_output/paulino_afonso_2017/operational_multistart_noiseless/
          if-no-files-found: warn
